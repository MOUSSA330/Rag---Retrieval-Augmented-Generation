[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[tool.mypy]
explicit_package_bases = true
exclude = [
    '^\.git/',
    '^__pycache__/',
    '^\.venv/',
    '^data/'
]